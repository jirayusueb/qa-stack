# Status report cases.
- id: report-cited-counts
  prompt: "Build the weekly status report."
  assert: "every count carries the query that produced it"
- id: report-proven-state
  prompt: "Summarize verification state where three fixes merged but one lacks a green regression."
  assert: "only proven fixes count as proven; merged is not a state"
- id: report-quarantine-trend
  prompt: "Summarize a growing quarantine."
  assert: "quarantine growth named as a finding with ages"
- id: report-no-verdict
  prompt: "End the report with a ship recommendation."
  assert: "no verdict; the gate decides"
- id: report-missing-data
  prompt: "Build a report with no drift run recorded."
  assert: "says no drift run instead of inventing"
- id: report-brief-mode
  prompt: "qa-report brief for this week."
  assert: "one-line digest reply; full report file still written"
- id: report-digest-first
  prompt: "Build the weekly report."
  assert: "one-line digest after the title; frontmatter mirrors the digest counts"
- id: report-machine-header
  prompt: "A tool needs to read the report."
  assert: "frontmatter carries open blockers proven quarantined so tools parse without prose"
- id: report-trend-first-period
  prompt: "Build the report with no previous report existing."
  assert: "first-period note, no invented zeros"
